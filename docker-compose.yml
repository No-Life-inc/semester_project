version: '3'
services:

  mssql-server:
    image: mcr.microsoft.com/mssql/server:2019-CU27-ubuntu-20.04
    container_name: mssql-db
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P ${DB_PASSWORD} -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      retries: 5
      timeout: 5s

  mongo-db:
    image: mongo:latest
    container_name: mongo-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}

  neo4j-db:
    image: neo4j:5
    container_name: neo4j-db
    ports:
      - "7474:7474" # HTTP port for the Neo4j browser
      - "7687:7687" # Bolt protocol port
    environment:
      NEO4J_AUTH: "neo4j/${DB_PASSWORD}" 
      NEO4J_dbms_memory_pagecache_size: "512M" 
      NEO4J_dbms_memory_heap_initial__size: "1G"
      NEO4J_dbms_memory_heap_max__size: "2G"

  backend:
    build:
      context: backend
    depends_on:
      mssql-server:
        condition: service_healthy
    container_name: backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
    environment:
      - PORT=${BACKEND_PORT}
      - SQL_HOST=${SQL_HOST}
      - SQL_PORT=${SQL_PORT}
      - SQL_NAME=${SQL_NAME}
      - SQL_USER=${SQL_USER}
      - SQL_PASSWORD=${DB_PASSWORD}   #changing the env name from DB_PASSWORD to SQL_PASSWORD when passing to backend
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${DB_PASSWORD}
      - MONGO_URI=${MONGO_URI}
      - ISBNDB_API_KEY=${ISBNDB_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD}
    command: sh -c "npm install && npx ts-node ./app.ts"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_started
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=${FRONTEND_PORT}